name: RISC-V RTL CI

on:
  push:
    branches: [main, feat/rv64-program-loader]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl-regression:
    name: Full RTL regression - Verilator 5.040
    runs-on: ubuntu-22.04
    env:
      VERILATOR_TAG: v5.040

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build selected Verilator release in the runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rv64-validation"
          exec > >(tee "$RUNNER_TEMP/rv64-validation/verilator-build.log") 2>&1
          free -h
          df -h "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y autoconf bison flex libfl-dev help2man build-essential git python3
          printf '#include <FlexLexer.h>\n' | c++ -x c++ -fsyntax-only -
          git clone --depth 1 --branch "$VERILATOR_TAG" https://github.com/verilator/verilator.git "$RUNNER_TEMP/verilator-src"
          cd "$RUNNER_TEMP/verilator-src"
          git rev-parse HEAD
          autoconf
          ./configure --prefix="$RUNNER_TEMP/verilator-install"
          make -j2
          make install
          echo "VERILATOR=$RUNNER_TEMP/verilator-install/bin/verilator" >> "$GITHUB_ENV"

      - name: Record dependency versions
        env:
          VALIDATION_ROOT: ${{ runner.temp }}/rv64-validation
        run: |
          mkdir -p "$VALIDATION_ROOT"
          {
            "$VERILATOR" --version
            git -C "$RUNNER_TEMP/verilator-src" rev-parse HEAD
            dpkg-query -W autoconf bison flex libfl-dev help2man build-essential git python3
          } > "$VALIDATION_ROOT/dependencies.log"
          cat "$VALIDATION_ROOT/dependencies.log"

      - name: Run full regression from a clean source snapshot
        env:
          CLEAN_ROOT: ${{ runner.temp }}/rv64-validation/clean
          LOG_ROOT: ${{ runner.temp }}/rv64-validation/results
        run: bash scripts/run_clean_regression.sh

      - name: Require unchanged source checkout
        if: always()
        run: |
          git status --short
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-validation
          path: |
            ${{ runner.temp }}/rv64-validation/**/*.log
            ${{ runner.temp }}/rv64-validation/results/manifest.json
            ${{ runner.temp }}/rv64-validation/results/summary.tsv
          if-no-files-found: warn
