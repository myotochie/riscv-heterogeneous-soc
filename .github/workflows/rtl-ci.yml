name: RISC-V RTL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rtl-regression:
    name: RTL Regression - Verilator
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            verilator \
            build-essential \
            make \
            git

      - name: Display tool versions
        run: |
          verilator --version
          g++ --version

      - name: Run RTL unit and integration tests
        run: |
          chmod +x scripts/run_unit_tests.sh
          ./scripts/run_unit_tests.sh

      - name: Check generated artifacts
        if: always()
        run: |
          git status --short
